<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4d9fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main folder/bar shape -->
  <rect x="12" y="28" width="72" height="48" rx="4" fill="url(#grad1)"/>

  <!-- Stacked bars effect -->
  <rect x="16" y="20" width="64" height="8" rx="2" fill="#0066cc" opacity="0.6"/>
  <rect x="20" y="12" width="56" height="8" rx="2" fill="#0066cc" opacity="0.3"/>

  <!-- Bookmarks inside -->
  <rect x="24" y="40" width="8" height="24" rx="2" fill="white" opacity="0.9"/>
  <rect x="38" y="40" width="8" height="24" rx="2" fill="white" opacity="0.9"/>
  <rect x="52" y="40" width="8" height="24" rx="2" fill="white" opacity="0.9"/>
  <rect x="66" y="40" width="8" height="24" rx="2" fill="white" opacity="0.9"/>
</svg>
