<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="1280" height="800" fill="#0a0a0a"/>

  <!-- Sidebar Container -->
  <rect x="40" y="40" width="360" height="720" fill="#1a1a1a" stroke="#444444" stroke-width="1"/>

  <!-- Header -->
  <g id="header">
    <rect x="40" y="40" width="360" height="56" fill="#1a1a1a"/>
    <line x1="40" y1="96" x2="400" y2="96" stroke="#444444" stroke-width="1"/>

    <!-- Title -->
    <text x="52" y="72" font-family="system-ui" font-size="18" font-weight="600" fill="#e0e0e0">Project Bookmarks</text>

    <!-- Buttons -->
    <rect x="280" y="54" width="45" height="28" rx="4" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>
    <text x="290" y="73" font-family="system-ui" font-size="12" fill="#e0e0e0">⊞⊟</text>

    <rect x="330" y="54" width="58" height="28" rx="4" fill="#4d9fff" stroke="#4d9fff" stroke-width="1"/>
    <text x="338" y="73" font-family="system-ui" font-size="13" font-weight="500" fill="#ffffff">+ New</text>
  </g>

  <!-- Quick Actions -->
  <g id="quick-actions">
    <rect x="52" y="108" width="336" height="40" rx="4" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>
    <text x="150" y="133" font-family="system-ui" font-size="13" font-weight="500" fill="#e0e0e0">⭐ Add Current Tab</text>
  </g>

  <!-- Work Bar (Expanded, Active) -->
  <g id="work-bar">
    <rect x="52" y="164" width="336" height="200" rx="6" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>

    <!-- Bar Header - Active (blue) -->
    <rect x="52" y="164" width="336" height="44" rx="6" fill="#4d9fff"/>
    <text x="72" y="191" font-family="system-ui" font-size="12" fill="#ffffff">▶</text>
    <text x="88" y="191" font-family="system-ui" font-size="14" font-weight="500" fill="#ffffff">Work</text>

    <!-- Bar Actions -->
    <text x="340" y="191" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">⇪</text>
    <text x="356" y="191" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">✎</text>
    <text x="372" y="191" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">✕</text>

    <!-- Bookmarks -->
    <g id="bookmarks">
      <line x1="52" y1="208" x2="388" y2="208" stroke="#444444" stroke-width="1"/>

      <!-- Bookmark 1 -->
      <rect x="60" y="216" width="320" height="28" rx="4" fill="#1a1a1a"/>
      <circle cx="76" cy="230" r="8" fill="#4285F4"/>
      <text x="92" y="233" font-family="system-ui" font-size="13" fill="#e0e0e0">GitHub</text>

      <!-- Bookmark 2 -->
      <rect x="60" y="248" width="320" height="28" rx="4" fill="#1a1a1a"/>
      <circle cx="76" cy="262" r="8" fill="#EA4335"/>
      <text x="92" y="265" font-family="system-ui" font-size="13" fill="#e0e0e0">Gmail</text>

      <!-- Bookmark 3 -->
      <rect x="60" y="280" width="320" height="28" rx="4" fill="#1a1a1a"/>
      <circle cx="76" cy="294" r="8" fill="#F48024"/>
      <text x="92" y="297" font-family="system-ui" font-size="13" fill="#e0e0e0">Stack Overflow</text>

      <!-- Add Bookmark Button -->
      <rect x="60" y="316" width="320" height="36" rx="4" fill="#2a2a2a" stroke="#444444" stroke-width="1" stroke-dasharray="4"/>
      <text x="150" y="338" font-family="system-ui" font-size="12" fill="#aaaaaa">+ Add Bookmark</text>
    </g>
  </g>

  <!-- Personal Bar (Collapsed) -->
  <g id="personal-bar">
    <rect x="52" y="376" width="336" height="38" rx="6" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>

    <!-- Bar Header -->
    <rect x="52" y="376" width="336" height="38" rx="6" fill="#2a2a2a"/>
    <text x="64" y="399" font-family="system-ui" font-size="12" fill="#aaaaaa">▶</text>
    <text x="80" y="399" font-family="system-ui" font-size="14" font-weight="500" fill="#e0e0e0">Personal</text>
  </g>

  <!-- Research Bar (Expanded) -->
  <g id="research-bar">
    <rect x="52" y="426" width="336" height="160" rx="6" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>

    <!-- Bar Header -->
    <rect x="52" y="426" width="336" height="44" rx="6" fill="#2a2a2a"/>
    <text x="72" y="453" font-family="system-ui" font-size="12" fill="#aaaaaa">▶</text>
    <text x="88" y="453" font-family="system-ui" font-size="14" font-weight="500" fill="#e0e0e0">Research</text>

    <!-- Bookmarks -->
    <g id="research-bookmarks">
      <line x1="52" y1="470" x2="388" y2="470" stroke="#444444" stroke-width="1"/>

      <!-- Bookmark 1 -->
      <rect x="60" y="478" width="320" height="28" rx="4" fill="#1a1a1a"/>
      <circle cx="76" cy="492" r="8" fill="#FF6B35"/>
      <text x="92" y="495" font-family="system-ui" font-size="13" fill="#e0e0e0">Mozilla Developer Network</text>

      <!-- Bookmark 2 -->
      <rect x="60" y="510" width="320" height="28" rx="4" fill="#1a1a1a"/>
      <circle cx="76" cy="524" r="8" fill="#00D9FF"/>
      <text x="92" y="527" font-family="system-ui" font-size="13" fill="#e0e0e0">Web Extensions API</text>

      <!-- Add Bookmark Button -->
      <rect x="60" y="546" width="320" height="32" rx="4" fill="#2a2a2a" stroke="#444444" stroke-width="1" stroke-dasharray="4"/>
      <text x="150" y="566" font-family="system-ui" font-size="12" fill="#aaaaaa">+ Add Bookmark</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="footer">
    <line x1="52" y1="608" x2="388" y2="608" stroke="#444444" stroke-width="1"/>
    <text x="298" y="638" font-family="system-ui" font-size="12" fill="#aaaaaa">Export</text>
    <text x="348" y="638" font-family="system-ui" font-size="12" fill="#aaaaaa">Import</text>
  </g>

  <!-- Context Label -->
  <text x="450" y="100" font-family="system-ui" font-size="16" fill="#e0e0e0">Dark Mode Support</text>
  <text x="450" y="130" font-family="system-ui" font-size="14" fill="#aaaaaa">Automatically adapts to your system theme</text>

  <!-- Feature Highlights -->
  <g id="highlights">
    <text x="450" y="180" font-family="system-ui" font-size="13" font-weight="600" fill="#e0e0e0">✅ Automatic dark mode detection</text>
    <text x="450" y="210" font-family="system-ui" font-size="13" font-weight="600" fill="#e0e0e0">✅ Easy on the eyes for night work</text>
    <text x="450" y="240" font-family="system-ui" font-size="13" font-weight="600" fill="#e0e0e0">✅ Matches Firefox theme</text>
    <text x="450" y="270" font-family="system-ui" font-size="13" font-weight="600" fill="#e0e0e0">✅ Consistent color scheme</text>
    <text x="450" y="300" font-family="system-ui" font-size="13" font-weight="600" fill="#e0e0e0">✅ High contrast for readability</text>
  </g>

  <!-- Dark theme color palette showcase -->
  <g id="color-palette">
    <text x="450" y="350" font-family="system-ui" font-size="14" font-weight="600" fill="#e0e0e0">Dark Theme Colors:</text>

    <rect x="450" y="365" width="60" height="30" rx="4" fill="#1a1a1a" stroke="#444444" stroke-width="1"/>
    <text x="520" y="385" font-family="system-ui" font-size="11" fill="#aaaaaa">Primary BG</text>

    <rect x="450" y="405" width="60" height="30" rx="4" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>
    <text x="520" y="425" font-family="system-ui" font-size="11" fill="#aaaaaa">Secondary BG</text>

    <rect x="450" y="445" width="60" height="30" rx="4" fill="#4d9fff"/>
    <text x="520" y="465" font-family="system-ui" font-size="11" fill="#aaaaaa">Accent Blue</text>

    <rect x="450" y="485" width="60" height="30" rx="4" fill="#333333" stroke="#444444" stroke-width="1"/>
    <text x="520" y="505" font-family="system-ui" font-size="11" fill="#aaaaaa">Hover State</text>
  </g>

  <!-- Moon icon for dark mode -->
  <g transform="translate(750, 180)">
    <circle cx="30" cy="30" r="28" fill="#4d9fff" opacity="0.2"/>
    <circle cx="30" cy="30" r="20" fill="#e0e0e0"/>
    <circle cx="35" cy="25" r="18" fill="#2a2a2a"/>
  </g>
</svg>
