<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar Container -->
  <rect x="40" y="40" width="360" height="720" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Header -->
  <g id="header">
    <rect x="40" y="40" width="360" height="56" fill="#ffffff"/>
    <line x1="40" y1="96" x2="400" y2="96" stroke="#d0d0d0" stroke-width="1"/>

    <!-- Title -->
    <text x="52" y="72" font-family="system-ui" font-size="18" font-weight="600" fill="#1a1a1a">Project Bookmarks</text>

    <!-- Buttons -->
    <rect x="280" y="54" width="45" height="28" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="290" y="73" font-family="system-ui" font-size="12" fill="#1a1a1a">⊞⊟</text>

    <rect x="330" y="54" width="58" height="28" rx="4" fill="#0066cc" stroke="#0066cc" stroke-width="1"/>
    <text x="338" y="73" font-family="system-ui" font-size="13" font-weight="500" fill="#ffffff">+ New</text>
  </g>

  <!-- Quick Actions -->
  <g id="quick-actions">
    <rect x="52" y="108" width="336" height="40" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="150" y="133" font-family="system-ui" font-size="13" font-weight="500" fill="#1a1a1a">⭐ Add Current Tab</text>
  </g>

  <!-- Work Bar (Collapsed) -->
  <g id="work-bar-collapsed">
    <rect x="52" y="160" width="336" height="32" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="64" y="180" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="80" y="180" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Work</text>
    <text x="360" y="180" font-family="system-ui" font-size="11" fill="#999999">4</text>
  </g>

  <!-- Personal Bar (Collapsed) -->
  <g id="personal-bar-collapsed">
    <rect x="52" y="198" width="336" height="32" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="64" y="218" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="80" y="218" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Personal</text>
    <text x="356" y="218" font-family="system-ui" font-size="11" fill="#999999">12</text>
  </g>

  <!-- Research Bar (Active, Expanded) -->
  <g id="research-bar">
    <rect x="52" y="236" width="336" height="280" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>

    <!-- Bar Header - Active -->
    <rect x="52" y="236" width="336" height="44" rx="6" fill="#0066cc"/>
    <text x="72" y="263" font-family="system-ui" font-size="12" fill="#ffffff">▶</text>
    <text x="88" y="263" font-family="system-ui" font-size="14" font-weight="500" fill="#ffffff">Research</text>

    <!-- Bar Actions -->
    <text x="340" y="263" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">⇪</text>
    <text x="356" y="263" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">✎</text>
    <text x="372" y="263" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.9)">✕</text>

    <!-- Bookmarks -->
    <g id="research-bookmarks">
      <line x1="52" y1="280" x2="388" y2="280" stroke="#d0d0d0" stroke-width="1"/>

      <!-- Bookmark 1 -->
      <rect x="60" y="288" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="302" r="8" fill="#FF6B35"/>
      <text x="92" y="305" font-family="system-ui" font-size="13" fill="#1a1a1a">Mozilla Developer Network</text>

      <!-- Bookmark 2 -->
      <rect x="60" y="320" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="334" r="8" fill="#00D9FF"/>
      <text x="92" y="337" font-family="system-ui" font-size="13" fill="#1a1a1a">Web Extensions API</text>

      <!-- Bookmark 3 -->
      <rect x="60" y="352" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="366" r="8" fill="#4285F4"/>
      <text x="92" y="369" font-family="system-ui" font-size="13" fill="#1a1a1a">GitHub WebExtensions</text>

      <!-- Bookmark 4 -->
      <rect x="60" y="384" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="398" r="8" fill="#F48024"/>
      <text x="92" y="401" font-family="system-ui" font-size="13" fill="#1a1a1a">Stack Overflow - Extensions</text>

      <!-- Bookmark 5 -->
      <rect x="60" y="416" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="430" r="8" fill="#34A853"/>
      <text x="92" y="433" font-family="system-ui" font-size="13" fill="#1a1a1a">Browser API Documentation</text>

      <!-- Add Bookmark Button -->
      <rect x="60" y="452" width="320" height="52" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4"/>
      <text x="150" y="482" font-family="system-ui" font-size="12" fill="#666666">+ Add Bookmark</text>
    </g>
  </g>

  <!-- DevOps Bar (Collapsed) -->
  <g id="devops-bar-collapsed">
    <rect x="52" y="522" width="336" height="32" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="64" y="542" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="80" y="542" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">DevOps</text>
    <text x="360" y="542" font-family="system-ui" font-size="11" fill="#999999">8</text>
  </g>

  <!-- Learning Bar (Collapsed) -->
  <g id="learning-bar-collapsed">
    <rect x="52" y="560" width="336" height="32" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="64" y="580" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="80" y="580" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Learning</text>
    <text x="360" y="580" font-family="system-ui" font-size="11" fill="#999999">6</text>
  </g>

  <!-- Job Search Bar (Collapsed) -->
  <g id="job-bar-collapsed">
    <rect x="52" y="598" width="336" height="32" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="64" y="618" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="80" y="618" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Job Search</text>
    <text x="356" y="618" font-family="system-ui" font-size="11" fill="#999999">15</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <line x1="52" y1="646" x2="388" y2="646" stroke="#d0d0d0" stroke-width="1"/>
    <text x="298" y="676" font-family="system-ui" font-size="12" fill="#666666">Export</text>
    <text x="348" y="676" font-family="system-ui" font-size="12" fill="#666666">Import</text>
  </g>

  <!-- Annotations -->
  <g id="annotations">
    <text x="450" y="100" font-family="system-ui" font-size="16" font-weight="600" fill="#1a1a1a">Collapsed Bars Save Space</text>
    <text x="450" y="130" font-family="system-ui" font-size="14" fill="#666666">Manage many projects without clutter</text>

    <!-- Arrow pointing to collapsed bars -->
    <line x1="430" y1="180" x2="395" y2="175" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="440" y="175" font-family="system-ui" font-size="13" fill="#1a1a1a">Collapsed bars are</text>
    <text x="440" y="195" font-family="system-ui" font-size="12" fill="#666666">compact (38px height)</text>

    <!-- Arrow pointing to expanded bar -->
    <line x1="430" y1="340" x2="395" y2="350" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="440" y="335" font-family="system-ui" font-size="13" fill="#1a1a1a">Active bar expanded</text>
    <text x="440" y="355" font-family="system-ui" font-size="12" fill="#666666">with full bookmark list</text>

    <!-- Arrow pointing to bookmark count -->
    <line x1="430" y1="220" x2="380" y2="215" stroke="#999999" stroke-width="1" marker-end="url(#arrowgray)"/>
    <text x="440" y="215" font-family="system-ui" font-size="12" fill="#999999">Bookmark count</text>
  </g>

  <!-- Feature Highlights -->
  <g id="highlights">
    <text x="450" y="430" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Manage 6+ projects in one view</text>
    <text x="450" y="455" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Toggle all bars with one click</text>
    <text x="450" y="480" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Focus on one project at a time</text>
    <text x="450" y="505" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Reduced clutter, improved workflow</text>
    <text x="450" y="530" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Bookmark counts visible when collapsed</text>
  </g>

  <!-- Comparison -->
  <g id="comparison">
    <text x="450" y="580" font-family="system-ui" font-size="13" font-weight="600" fill="#666666">Space comparison:</text>
    <text x="450" y="605" font-family="system-ui" font-size="12" fill="#666666">• 6 collapsed bars: ~200px</text>
    <text x="450" y="625" font-family="system-ui" font-size="12" fill="#666666">• 6 expanded bars: ~1200px</text>
    <text x="450" y="645" font-family="system-ui" font-size="12" font-weight="600" fill="#00aa00">→ 6x more efficient!</text>
  </g>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0066cc" />
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999999" />
    </marker>
  </defs>
</svg>
