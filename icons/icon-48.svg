<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4d9fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main folder/bar shape -->
  <rect x="6" y="14" width="36" height="24" rx="2" fill="url(#grad1)"/>

  <!-- Stacked bars effect -->
  <rect x="8" y="10" width="32" height="4" rx="1" fill="#0066cc" opacity="0.6"/>
  <rect x="10" y="6" width="28" height="4" rx="1" fill="#0066cc" opacity="0.3"/>

  <!-- Bookmarks inside -->
  <rect x="12" y="20" width="4" height="12" rx="1" fill="white" opacity="0.9"/>
  <rect x="19" y="20" width="4" height="12" rx="1" fill="white" opacity="0.9"/>
  <rect x="26" y="20" width="4" height="12" rx="1" fill="white" opacity="0.9"/>
  <rect x="33" y="20" width="4" height="12" rx="1" fill="white" opacity="0.9"/>
</svg>
