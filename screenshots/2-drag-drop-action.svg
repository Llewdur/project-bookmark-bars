<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- Sidebar Container -->
  <rect x="40" y="40" width="360" height="720" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Header -->
  <g id="header">
    <rect x="40" y="40" width="360" height="56" fill="#ffffff"/>
    <line x1="40" y1="96" x2="400" y2="96" stroke="#d0d0d0" stroke-width="1"/>

    <text x="52" y="72" font-family="system-ui" font-size="18" font-weight="600" fill="#1a1a1a">Project Bookmarks</text>

    <rect x="280" y="54" width="45" height="28" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="290" y="73" font-family="system-ui" font-size="12" fill="#1a1a1a">⊞⊟</text>

    <rect x="330" y="54" width="58" height="28" rx="4" fill="#0066cc" stroke="#0066cc" stroke-width="1"/>
    <text x="338" y="73" font-family="system-ui" font-size="13" font-weight="500" fill="#ffffff">+ New</text>
  </g>

  <!-- Quick Actions -->
  <g id="quick-actions">
    <rect x="52" y="108" width="336" height="40" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
    <text x="150" y="133" font-family="system-ui" font-size="13" font-weight="500" fill="#1a1a1a">⭐ Add Current Tab</text>
  </g>

  <!-- Work Bar (Expanded) -->
  <g id="work-bar">
    <rect x="52" y="164" width="336" height="200" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>

    <!-- Bar Header -->
    <rect x="52" y="164" width="336" height="44" rx="6" fill="#f5f5f5"/>
    <text x="72" y="191" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="88" y="191" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Work</text>

    <!-- Bookmarks -->
    <g id="bookmarks">
      <line x1="52" y1="208" x2="388" y2="208" stroke="#d0d0d0" stroke-width="1"/>

      <!-- Bookmark 1 -->
      <rect x="60" y="216" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="230" r="8" fill="#4285F4"/>
      <text x="92" y="233" font-family="system-ui" font-size="13" fill="#1a1a1a">GitHub</text>

      <!-- Bookmark 2 (being dragged - semi-transparent) -->
      <rect x="60" y="248" width="320" height="28" rx="4" fill="#0066cc" opacity="0.4"/>
      <circle cx="76" cy="262" r="8" fill="#EA4335" opacity="0.4"/>
      <text x="92" y="265" font-family="system-ui" font-size="13" fill="#ffffff" opacity="0.6">Gmail</text>

      <!-- Bookmark 3 -->
      <rect x="60" y="280" width="320" height="28" rx="4" fill="#ffffff"/>
      <circle cx="76" cy="294" r="8" fill="#F48024"/>
      <text x="92" y="297" font-family="system-ui" font-size="13" fill="#1a1a1a">Stack Overflow</text>

      <!-- Add Bookmark Button -->
      <rect x="60" y="316" width="320" height="36" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4"/>
      <text x="150" y="338" font-family="system-ui" font-size="12" fill="#666666">+ Add Bookmark</text>
    </g>
  </g>

  <!-- Personal Bar (Collapsed - DRAG TARGET) -->
  <g id="personal-bar">
    <!-- Highlight effect during drag -->
    <rect x="52" y="376" width="336" height="38" rx="6" fill="#0066cc" opacity="0.6" stroke="#0066cc" stroke-width="2" stroke-dasharray="8"/>

    <!-- Bar Header -->
    <text x="64" y="399" font-family="system-ui" font-size="12" fill="#ffffff">▶</text>
    <text x="80" y="399" font-family="system-ui" font-size="14" font-weight="500" fill="#ffffff">Personal</text>
  </g>

  <!-- Research Bar (Expanded - also drag target) -->
  <g id="research-bar">
    <rect x="52" y="426" width="336" height="180" rx="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>

    <!-- Bar Header -->
    <rect x="52" y="426" width="336" height="44" rx="6" fill="#f5f5f5"/>
    <text x="72" y="453" font-family="system-ui" font-size="12" fill="#666666">▶</text>
    <text x="88" y="453" font-family="system-ui" font-size="14" font-weight="500" fill="#1a1a1a">Research</text>

    <!-- Bookmarks -->
    <g id="research-bookmarks">
      <line x1="52" y1="470" x2="388" y2="470" stroke="#d0d0d0" stroke-width="1"/>

      <!-- Drop zone highlight -->
      <rect x="60" y="478" width="320" height="100" rx="4" fill="#0066cc" opacity="0.2" stroke="#0066cc" stroke-width="2" stroke-dasharray="8"/>

      <!-- Bookmark 1 -->
      <rect x="60" y="478" width="320" height="28" rx="4" fill="transparent"/>
      <circle cx="76" cy="492" r="8" fill="#FF6B35"/>
      <text x="92" y="495" font-family="system-ui" font-size="13" fill="#1a1a1a">Mozilla Developer Network</text>

      <!-- Add Bookmark Button -->
      <rect x="60" y="566" width="320" height="32" rx="4" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4"/>
      <text x="150" y="586" font-family="system-ui" font-size="12" fill="#666666">+ Add Bookmark</text>
    </g>
  </g>

  <!-- Dragged Bookmark (floating with cursor) -->
  <g id="dragged-bookmark" transform="translate(200, 380)">
    <rect width="200" height="28" rx="4" fill="#0066cc" stroke="#0066cc" stroke-width="2"/>
    <circle cx="16" cy="14" r="8" fill="#EA4335"/>
    <text x="32" y="19" font-family="system-ui" font-size="13" fill="#ffffff" font-weight="500">Gmail</text>

    <!-- Shadow effect -->
    <ellipse cx="100" cy="32" rx="80" ry="4" fill="#000000" opacity="0.2"/>
  </g>

  <!-- Mouse cursor indicator -->
  <g transform="translate(220, 395)">
    <path d="M 0 0 L 0 20 L 6 15 L 10 22 L 13 20 L 9 13 L 15 12 Z" fill="#1a1a1a"/>
    <path d="M 0 0 L 0 20 L 6 15 L 10 22 L 13 20 L 9 13 L 15 12 Z" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Annotations -->
  <g id="annotations">
    <text x="450" y="100" font-family="system-ui" font-size="16" font-weight="600" fill="#1a1a1a">Drag & Drop in Action</text>

    <!-- Arrow pointing to dragged item -->
    <line x1="430" y1="250" x2="380" y2="390" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="440" y="245" font-family="system-ui" font-size="13" fill="#1a1a1a">Bookmark being dragged</text>
    <text x="440" y="265" font-family="system-ui" font-size="12" fill="#666666">from "Work" bar</text>

    <!-- Arrow pointing to drop target -->
    <line x1="430" y1="350" x2="395" y2="395" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="440" y="345" font-family="system-ui" font-size="13" fill="#1a1a1a">Blue outline shows</text>
    <text x="440" y="365" font-family="system-ui" font-size="12" fill="#666666">valid drop target</text>

    <!-- Arrow pointing to collapsed bar target -->
    <line x1="430" y1="430" x2="390" y2="395" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="440" y="425" font-family="system-ui" font-size="13" fill="#1a1a1a">Works even on</text>
    <text x="440" y="445" font-family="system-ui" font-size="12" fill="#666666">collapsed bars!</text>
  </g>

  <!-- Feature Highlights -->
  <g id="highlights">
    <text x="450" y="520" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Drag between bars</text>
    <text x="450" y="545" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Reorder within same bar</text>
    <text x="450" y="570" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Drop on collapsed bars</text>
    <text x="450" y="595" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Visual feedback with blue outline</text>
    <text x="450" y="620" font-family="system-ui" font-size="13" font-weight="600" fill="#1a1a1a">✅ Import entire folders at once</text>
  </g>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0066cc" />
    </marker>
  </defs>
</svg>
